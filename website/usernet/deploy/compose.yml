services:
  site:
    image: nginx:1.29-alpine
    container_name: usernet-site
    restart: unless-stopped
    user: "101:101"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=700
      - /var/run:uid=101,gid=101,mode=700
      - /tmp:uid=101,gid=101,mode=700
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=external
      - traefik.http.routers.usernet-site.rule=Host(`www.userlay.com`) && PathPrefix(`/usernet/`)
      - traefik.http.routers.usernet-site.priority=110
      - traefik.http.routers.usernet-site.entrypoints=websecure
      - traefik.http.routers.usernet-site.tls=true
      - traefik.http.routers.usernet-site.tls.certresolver=letsencrypt
      - traefik.http.routers.usernet-site.middlewares=usernet-site-strip
      - traefik.http.middlewares.usernet-site-strip.stripprefix.prefixes=/usernet
      - traefik.http.routers.usernet-site.service=usernet-site
      - traefik.http.services.usernet-site.loadbalancer.server.port=8080
      - traefik.http.routers.usernet-site-apex.rule=Host(`userlay.com`) && (Path(`/usernet`) || PathPrefix(`/usernet/`))
      - traefik.http.routers.usernet-site-apex.priority=111
      - traefik.http.routers.usernet-site-apex.entrypoints=websecure
      - traefik.http.routers.usernet-site-apex.tls=true
      - traefik.http.routers.usernet-site-apex.tls.certresolver=letsencrypt
      - traefik.http.routers.usernet-site-apex.middlewares=usernet-site-apex-redirect
      - traefik.http.middlewares.usernet-site-apex-redirect.redirectregex.regex=^https?://userlay\.com/usernet/?(.*)
      - traefik.http.middlewares.usernet-site-apex-redirect.redirectregex.replacement=https://www.userlay.com/usernet/$${1}
      - traefik.http.middlewares.usernet-site-apex-redirect.redirectregex.permanent=true
      - traefik.http.routers.usernet-site-apex.service=usernet-site
    networks:
      - external

networks:
  external:
    external: true
