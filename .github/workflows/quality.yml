name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test website/usernet/app.test.cjs

  go-core:
    name: Go core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: core/go.sum
      - run: go test ./...
        working-directory: core
      - name: Test Go core without CGO
        env:
          CGO_ENABLED: 0
        run: go test ./...
        working-directory: core
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: core

  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting of changed Dart files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash tool/check_dart_format.sh "$BASE_SHA"
      - run: flutter analyze --no-fatal-infos
      - run: bash tool/check_plugins.sh
      - run: flutter test

  android-native:
    name: Android native tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: vconnect/relay/go.sum
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'ndk;28.2.13676358'
      - name: Install Android 17 preview platform
        run: yes | sdkmanager --channel=3 'platforms;android-37.0'
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.8.0'
      - name: Select Android NDK for Flutter hooks
        shell: bash
        run: |
          ndk="${ANDROID_HOME:?ANDROID_HOME is not set}/ndk/28.2.13676358"
          clang_root="$ndk/toolchains/llvm/prebuilt/linux-x86_64"
          test -x "$clang_root/bin/clang"

          found_libclang=false
          for directory in "$clang_root/lib" "$clang_root/lib64"; do
            if compgen -G "$directory/libclang.*" >/dev/null; then
              found_libclang=true
              break
            fi
          done
          if [[ "$found_libclang" != true ]]; then
            echo "NDK 28.2 is missing libclang required by Flutter native hooks." >&2
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Test Android call relay
        working-directory: vconnect/relay
        run: go test ./...
      - run: gradle -p android --no-daemon :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest :app:compileDebugKotlin
      - name: Build Android call relay
        run: bash scripts/build-usernet-relay.sh
      - name: Build Android debug APK for device validation
        run: flutter build apk --debug --target-platform android-arm64
      - name: Verify Android debug APK includes the call relay
        run: unzip -Z1 build/app/outputs/flutter-apk/app-debug.apk | grep -Fx 'lib/arm64-v8a/libusernetrelay.so'
      - if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usernet-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 1

  shell-hooks:
    name: Shell hook tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: bash tool/hooks/test.sh
      - run: bash test/tool/release_branch_guard_test.sh
      - name: Test OTA bundle validation and publication
        run: python3 -m unittest discover -s test -p 'test_usernet_ota.py' -v
