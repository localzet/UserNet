name: Desktop builds

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          flutter-version: 3.47.6
          channel: stable
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: core/go.sum
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          target: x86_64-pc-windows-msvc
          cache: false
      - run: flutter pub get
      - run: dart setup.dart windows --env stable --targets exe,zip --arch amd64
      - name: Create checksums
        shell: pwsh
        run: Get-ChildItem dist -File | ForEach-Object { $hash = Get-FileHash $_.FullName -Algorithm SHA256; "$($hash.Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usernet-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          flutter-version: 3.47.6
          channel: stable
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install pinned DMG packager
        run: npm install --global --allow-scripts=fs-xattr,macos-alias create-dmg@8.1.0
      - run: flutter pub get
      - run: dart setup.dart macos --env stable --arch ${{ matrix.arch }}
      - name: Create checksums
        run: shasum -a 256 dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usernet-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish verified GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-pre.')
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag is on main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Download desktop build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name usernet-windows-x64 --dir "$RUNNER_TEMP/artifacts/windows"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name usernet-macos-arm64 --dir "$RUNNER_TEMP/artifacts/macos-arm64"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name usernet-macos-amd64 --dir "$RUNNER_TEMP/artifacts/macos-amd64"
          mkdir -p release-assets
          find "$RUNNER_TEMP/artifacts" -type f ! -name SHA256SUMS.txt \
            -exec cp {} release-assets/ \;

      - name: Add current signed Android and Linux packages
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets

          android_manifest="$(mktemp)"
          linux_manifest="$(mktemp)"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://updates.userlay.com/android/stable.json -o "$android_manifest"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://updates.userlay.com/linux/stable.json -o "$linux_manifest"

          test "$(jq -er '.version' "$android_manifest")" = "$version"
          test "$(jq -er '.version' "$linux_manifest")" = "$version"
          android_url="$(jq -er '.apkUrl' "$android_manifest")"
          linux_url="$(jq -er '.debUrl' "$linux_manifest")"
          android_sha="$(jq -er '.sha256' "$android_manifest")"
          linux_sha="$(jq -er '.sha256' "$linux_manifest")"
          [[ "$android_url" == https://updates.userlay.com/android/* ]]
          [[ "$linux_url" == https://updates.userlay.com/linux/* ]]
          [[ "$android_sha" =~ ^[a-f0-9]{64}$ && "$linux_sha" =~ ^[a-f0-9]{64}$ ]]

          android_file="release-assets/UserNet-android.apk"
          linux_file="release-assets/UserNet-linux.deb"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$android_url" -o "$android_file"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$linux_url" -o "$linux_file"
          printf '%s  %s\n' "$android_sha" "$android_file" | sha256sum --check --strict
          printf '%s  %s\n' "$linux_sha" "$linux_file" | sha256sum --check --strict

      - name: Prepare release notes and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## " version "([[:space:]]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<'EOF'

          ### macOS installation
          These macOS packages are not signed with Developer ID or notarized. On first launch, approve UserNet in System Settings → Privacy & Security.
          EOF
          (cd release-assets && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "UserNet ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
