name: Desktop builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usernet-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plan:
    name: Check stable release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate release metadata and determine whether to publish
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version_line="$(sed -n 's/^version: //p' pubspec.yaml | head -n 1)"
          if [[ ! "$version_line" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]{10})$ ]]; then
            echo 'pubspec.yaml version must be X.Y.Z+YYYYMMDDNN.' >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          build="${BASH_REMATCH[2]}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Non-main validation run; stable publishing is disabled.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changelog_notes="$(mktemp)"
          awk -v version="$version" '
            $0 ~ "^## " version "([[:space:]]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$changelog_notes"
          if ! grep -q '[^[:space:]]' "$changelog_notes"; then
            echo "CHANGELOG.md has no release notes for $version." >&2
            exit 1
          fi

          remote_build=''
          remote_version=''
          for platform in android linux windows macos; do
            manifest="$(curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              "https://www.userlay.com/usernet-updates/$platform/stable.json")"
            platform_version="$(jq -er '.version | strings' <<< "$manifest")"
            platform_build="$(jq -er '.build | numbers' <<< "$manifest")"
            if [[ -z "$remote_build" ]]; then
              remote_build="$platform_build"
              remote_version="$platform_version"
            elif [[ "$remote_build" != "$platform_build" || "$remote_version" != "$platform_version" ]]; then
              echo 'Published OTA manifests are not on one consistent release.' >&2
              exit 1
            fi
          done

          if (( build < remote_build )); then
            echo "Refusing to publish build $build over newer OTA build $remote_build." >&2
            exit 1
          fi

          tag="v$version"
          draft=false
          if release_json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json isDraft 2>/dev/null)"; then
            draft="$(jq -r '.isDraft' <<< "$release_json")"
          fi

          if (( build == remote_build )); then
            if [[ "$remote_version" != "$version" ]]; then
              echo "Build $build is already published under version $remote_version." >&2
              exit 1
            fi
            if [[ "$draft" != true ]]; then
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              echo "Build $build is already live; nothing to publish."
              exit 0
            fi
          elif [[ "$draft" == true ]]; then
            echo "A draft $tag already exists; this run will resume its OTA publication."
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag is already published; increment the version before publishing." >&2
            exit 1
          fi

          echo 'publish=true' >> "$GITHUB_OUTPUT"
          echo "Ready to publish UserNet $version ($build)."

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          flutter-version: 3.47.6
          channel: stable
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: core/go.sum
      - name: Test Windows Geo database replacement
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: go test -run '^TestMappedMaxMindUpdateWaitsForTheNextCoreStart$' .
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          target: x86_64-pc-windows-msvc
          cache: false
      - run: flutter pub get
      - run: dart setup.dart windows --env stable --targets exe --arch amd64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usernet-windows-x64
          path: dist/UserNet-windows-amd64-setup.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          flutter-version: 3.47.6
          channel: stable
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: core/go.sum
      - run: flutter pub get
      - run: dart setup.dart macos --env stable --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usernet-macos-${{ matrix.arch }}
          path: dist/UserNet-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64 DEB
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          flutter-version: 3.47.6
          channel: stable
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: core/go.sum
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          target: x86_64-unknown-linux-gnu
          cache: false
      - run: flutter pub get
      - run: dart setup.dart linux --env stable --targets deb --arch amd64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usernet-linux-deb
          path: dist/UserNet-linux-amd64.deb
          if-no-files-found: error
          retention-days: 14

  android-release:
    name: Signed Android stable APK
    if: needs.release-plan.outputs.publish == 'true'
    needs: [release-plan]
    runs-on: ubuntu-24.04
    environment: usernet-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: vconnect/relay/go.sum
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'ndk;28.2.13676358 build-tools;36.0.0'
      - name: Install Android 17 preview platform
        run: yes | sdkmanager --channel=3 'platforms;android-37.0'
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          flutter-version: 3.47.6
          channel: stable
      - name: Select Android NDK for Flutter hooks
        shell: bash
        run: |
          set -euo pipefail
          ndk="${ANDROID_HOME:?ANDROID_HOME is not set}/ndk/28.2.13676358"
          clang_root="$ndk/toolchains/llvm/prebuilt/linux-x86_64"
          test -x "$clang_root/bin/clang"
          test -n "$(find "$clang_root" -maxdepth 2 -type f -name 'libclang.*' -print -quit)"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Build unsigned stable APK
        run: bash scripts/build-usernet-unsigned-stable.sh
      - name: Request short-lived identity and sign APK on isolated signer
        shell: bash
        run: |
          set -euo pipefail
          USERNET_RELEASE_VERSION='${{ needs.release-plan.outputs.version }}'
          USERNET_RELEASE_BUILD='${{ needs.release-plan.outputs.build }}'
          unsigned_apk="build/usernet-releases/usernet-unsigned-stable-$USERNET_RELEASE_VERSION-$USERNET_RELEASE_BUILD.apk"
          signed_apk="$RUNNER_TEMP/usernet-stable-$USERNET_RELEASE_VERSION-$USERNET_RELEASE_BUILD.apk"
          token_response="$RUNNER_TEMP/usernet-signer-token.json"
          auth_config="$RUNNER_TEMP/usernet-signer-auth.curl"
          response_headers="$RUNNER_TEMP/usernet-signer-response.headers"

          curl --fail --silent --show-error --get \
            --data-urlencode 'audience=usernet-release-signer' \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            --output "$token_response"
          token="$(jq -er '.value | strings' "$token_response")"
          printf 'header = "Authorization: Bearer %s"\n' "$token" > "$auth_config"
          chmod 600 "$auth_config"
          unset token
          rm -f "$token_response"

          curl --fail --silent --show-error \
            --config "$auth_config" \
            --header 'Content-Type: application/vnd.android.package-archive' \
            --dump-header "$response_headers" \
            --data-binary "@$unsigned_apk" \
            "https://www.userlay.com/usernet-release-signer/v1/sign?version=$USERNET_RELEASE_VERSION&build=$USERNET_RELEASE_BUILD" \
            --output "$signed_apk"

          expected_sha="$(awk 'tolower($1) == "x-content-sha256:" { gsub("\\r", ""); print $2 }' "$response_headers")"
          actual_sha="$(sha256sum "$signed_apk" | cut -d' ' -f1)"
          if [[ ! "$expected_sha" =~ ^[a-f0-9]{64}$ || "$expected_sha" != "$actual_sha" ]]; then
            echo 'Signer response checksum is invalid.' >&2
            exit 1
          fi
          install -D -m 0644 "$signed_apk" \
            "$RUNNER_TEMP/artifacts/android/usernet-stable-$USERNET_RELEASE_VERSION-$USERNET_RELEASE_BUILD.apk"
          rm -f "$auth_config" "$response_headers" "$signed_apk"
          echo "Signed stable APK SHA-256: $actual_sha"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: usernet-android-apk
          path: ${{ runner.temp }}/artifacts/android/usernet-stable-${{ needs.release-plan.outputs.version }}-${{ needs.release-plan.outputs.build }}.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the same build to OTA and GitHub
    if: needs.release-plan.outputs.publish == 'true'
    needs: [release-plan, windows, macos, linux, android-release]
    runs-on: ubuntu-24.04
    environment: usernet-production
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      USERNET_RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
      USERNET_RELEASE_BUILD: ${{ needs.release-plan.outputs.build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download platform builds from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name usernet-android-apk --dir "$RUNNER_TEMP/artifacts/android"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name usernet-linux-deb --dir "$RUNNER_TEMP/artifacts/linux"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name usernet-windows-x64 --dir "$RUNNER_TEMP/artifacts/windows"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name usernet-macos-arm64 --dir "$RUNNER_TEMP/artifacts/macos-arm64"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name usernet-macos-amd64 --dir "$RUNNER_TEMP/artifacts/macos-amd64"
      - name: Prepare and verify immutable OTA bundle
        shell: bash
        run: |
          set -euo pipefail
          release_notes="$RUNNER_TEMP/release-notes.md"
          awk -v version="$USERNET_RELEASE_VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$release_notes"
          test -s "$release_notes"
          cat >> "$release_notes" <<'EOF'

          ### macOS installation
          These macOS packages are not signed with Developer ID or notarized. On first launch, approve UserNet in System Settings → Privacy & Security.
          EOF

          python3 scripts/usernet_ota.py prepare \
            --version "$USERNET_RELEASE_VERSION" \
            --build "$USERNET_RELEASE_BUILD" \
            --notes "$release_notes" \
            --android "$RUNNER_TEMP/artifacts/android/usernet-stable-$USERNET_RELEASE_VERSION-$USERNET_RELEASE_BUILD.apk" \
            --linux "$RUNNER_TEMP/artifacts/linux/UserNet-linux-amd64.deb" \
            --windows "$RUNNER_TEMP/artifacts/windows/UserNet-windows-amd64-setup.exe" \
            --macos-arm64 "$RUNNER_TEMP/artifacts/macos-arm64/UserNet-macos-arm64.dmg" \
            --macos-amd64 "$RUNNER_TEMP/artifacts/macos-amd64/UserNet-macos-amd64.dmg" \
            --output "$RUNNER_TEMP/usernet-release"
          python3 scripts/usernet_ota.py verify "$RUNNER_TEMP/usernet-release/bundle"
      - name: Create or refresh hidden GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$USERNET_RELEASE_VERSION"
          shopt -s nullglob
          assets=("$RUNNER_TEMP/usernet-release/release-assets/"*)
          test "${#assets[@]}" -gt 0
          if release_json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<< "$release_json")" != true ]]; then
              echo "Refusing to replace published release $tag." >&2
              exit 1
            fi
            while IFS= read -r asset_name; do
              gh release delete-asset "$tag" "$asset_name" \
                --repo "$GITHUB_REPOSITORY" --yes
            done < <(jq -r '.assets[].name' <<< "$release_json")
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "UserNet $USERNET_RELEASE_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Publish verified bundle through the isolated OIDC receiver
        shell: bash
        run: |
          set -euo pipefail
          tar_file="$RUNNER_TEMP/usernet-release/ota-bundle.tar.gz"
          token_response="$RUNNER_TEMP/usernet-signer-token.json"
          auth_config="$RUNNER_TEMP/usernet-signer-auth.curl"
          curl --fail --silent --show-error --get \
            --data-urlencode 'audience=usernet-release-signer' \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            --output "$token_response"
          token="$(jq -er '.value | strings' "$token_response")"
          printf 'header = "Authorization: Bearer %s"\n' "$token" > "$auth_config"
          chmod 600 "$auth_config"
          unset token
          rm -f "$token_response"
          curl --fail --silent --show-error \
            --config "$auth_config" \
            --header 'Content-Type: application/gzip' \
            --data-binary "@$tar_file" \
            https://www.userlay.com/usernet-release-signer/v1/publish
          rm -f "$auth_config"
      - name: Verify public OTA manifests and packages
        shell: bash
        run: |
          set -euo pipefail
          for platform in android linux windows macos; do
            manifest="$RUNNER_TEMP/usernet-release/bundle/$platform/stable.json"
            live_manifest="$(curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              "https://www.userlay.com/usernet-updates/$platform/stable.json")"
            cmp -s <(jq -S . "$manifest") <(jq -S . <<< "$live_manifest")
            case "$platform" in
              android) asset_fields=(apkUrl:sha256) ;;
              linux) asset_fields=(debUrl:sha256) ;;
              windows) asset_fields=(installerUrl:sha256) ;;
              macos) asset_fields=(dmgArm64Url:sha256Arm64 dmgAmd64Url:sha256Amd64) ;;
              *) echo "Unexpected platform: $platform" >&2; exit 1 ;;
            esac
            for field_pair in "${asset_fields[@]}"; do
              IFS=: read -r url_field checksum_field <<< "$field_pair"
              url="$(jq -er --arg field "$url_field" '.[$field] | strings' "$manifest")"
              checksum="$(jq -er --arg field "$checksum_field" '.[$field] | strings' "$manifest")"
              download="$(mktemp "$RUNNER_TEMP/usernet-ota-asset.XXXXXX")"
              curl --fail --silent --show-error --location \
                --proto '=https' --proto-redir '=https' --tlsv1.2 \
                "$url" --output "$download"
              printf '%s  %s\n' "$checksum" "$download" | sha256sum --check --strict
              rm -f "$download"
            done
          done
      - name: Publish the GitHub release after OTA verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "v$USERNET_RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease=false \
            --title "UserNet $USERNET_RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
