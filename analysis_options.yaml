include: lint_options.yaml

formatter:
  trailing_commas: automate

analyzer:
  exclude:
    - build/**
    - lib/l10n/intl/**
    - lib/**/generated/**
    - plugins/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    invalid_annotation_target: ignore
